# Repo-specific overlay. Deep-merged over the canonical rsconstruct.toml.

# ─── what the Makefile did, and where it went ───────────────────────────────
#
# The Makefile's default target was empty (every DO_* flag was 0), so `make`
# built nothing. Its live capabilities are reproduced below:
#   XML_CHECK (xmllint --schema)  -> [processor.xmllint]
#   XML_CHECK (aspell, sgml mode) -> [processor.aspell] (non-interactive
#                                    `aspell list`; the Makefile ran aspell
#                                    interactively)
#   check_veltzer_https           -> [processor.script.check_veltzer_https]
#                                    (the make target was inverted as written:
#                                    it failed when the repo was CLEAN, because
#                                    `git grep` exits nonzero on no matches;
#                                    the script implements the actual intent)
#   install / install_xsd         -> [command.symlink_install]
#                                    (run `rsconstruct symlink-install`)
#   clean_soft / clean_me         -> `rsconstruct clean` / `git clean -ffxd`
#
# Dead targets, NOT reproduced (broken before the migration):
#   java_compile, XML_PDF (scripts/keynote_java_wrapper.py), checkstyle,
#   ivy fetch -- every dependency in ivy.xml is commented out and lib/ does
#   not exist, so javac cannot resolve jcommander/itextpdf/args4j and nothing
#   downstream of it can run.
#   jscheck (tools/jsl, gjslint), JS concat+minify (tools/closure.jar), and
#   jsdoc (node_modules/jsdoc) -- the tools/ and node_modules/ trees they
#   need are gone. scripts/tagname.py only versioned those dead JS bundles.

# ─── xml ─────────────────────────────────────────────────────────────────────

# Validate the presentations against the keynote schema, as the Makefile's
# XML_CHECK rule did with `xmllint --noout --schema xsd/keynote.xsd`.
[processor.xmllint]
src_dirs = ["presentations"]
args = ["--schema", "xsd/keynote.xsd"]
dep_inputs = ["xsd/keynote.xsd"]

# Spellcheck the presentation text, replacing the Makefile's interactive
# `aspell --mode=sgml --check` (sgml mode comes from .aspell.conf). Accepted
# jargon lives in .aspell.en.pws. Not zspell: its markdown extractor skips
# tab-indented lines as code blocks, and these XML files are tab-indented
# throughout, so zspell would silently check nothing.
[processor.aspell]
src_dirs = ["presentations"]
src_extensions = [".xml"]
# --mode must be on the command line; aspell ignores a `mode` line in the
# conf file and would then spell-check the markup itself (xmlns, xsi, ...).
args = ["--mode=sgml"]

# ─── link hygiene ────────────────────────────────────────────────────────────

# All links to veltzer.net must be https; see the script's docstring.
[processor.script.check_veltzer_https]
command = "scripts/check_veltzer_https.py"
src_extensions = [".xml", ".xsd", ".js", ".html", ".php", ".css", ".md", ".java", ".py", ".txt"]
src_dirs = ["."]
batch = true

# The tool registry installs the aspell binary itself, but the English
# dictionary is a separate apt package; without it aspell fails with
# "No word lists can be found for the language en" in CI.
[dependencies]
system = ["aspell-en"]

# ─── web install ─────────────────────────────────────────────────────────────

# The Makefile's install/install_xsd targets copied the site into
# ~/public_html/public/keynote. `rsconstruct symlink-install` links the same
# folders there. The root index.html (a one-line redirect to web/index.php)
# is not covered -- symlink-install takes folders only; copy it by hand on a
# machine that actually serves ~/public_html. The Makefile also shipped the
# out/js bundle and out/jsdoc, which no longer exist (dead JS pipeline, see
# above).
[command.symlink_install]
sources = ["xsd", "presentations", "jssrc", "web"]
targets = [
    "~/public_html/public/keynote/xsd",
    "~/public_html/public/keynote/presentations",
    "~/public_html/public/keynote/jssrc",
    "~/public_html/public/keynote/web",
]
